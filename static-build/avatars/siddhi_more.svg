<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93b5cf"/>
      <stop offset="50%" stop-color="#abc8dc"/>
      <stop offset="100%" stop-color="#7fa0bc"/>
    </linearGradient>
    <linearGradient id="blazer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3d5e"/>
      <stop offset="50%" stop-color="#1b2942"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="face-grad" cx="48%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#eed5be"/>
      <stop offset="55%" stop-color="#dfbd9e"/>
      <stop offset="100%" stop-color="#c99f7d"/>
    </radialGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1e15"/>
      <stop offset="60%" stop-color="#170f09"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Soft Blue Indoor Wall & World Map Backdrop -->
  <rect width="400" height="480" fill="url(#bg-grad)"/>

  <!-- Wall Chart Shapes in Background -->
  <path d="M 280 40 Q 320 80 390 90 L 400 240 L 260 210 Z" fill="#e8a838" opacity="0.35"/>
  <path d="M 200 0 Q 250 30 320 10 L 280 60 Z" fill="#dfc06b" opacity="0.3"/>

  <!-- Back Hair (Bob cut flared slightly at shoulders) -->
  <path d="M 108 190 Q 90 280 135 340 L 150 340 Q 115 280 128 200 Z" fill="url(#hair-grad)"/>
  <path d="M 292 190 Q 310 280 265 340 L 250 340 Q 285 280 272 200 Z" fill="url(#hair-grad)"/>

  <!-- Body: School Blazer (Navy Blue with white piping & Apex Crest) -->
  <path d="M 50 480 L 78 350 Q 120 315 168 315 L 232 315 Q 280 315 322 350 L 350 480 Z" fill="url(#blazer-grad)" filter="url(#soft-shadow)"/>

  <!-- White Piping along Blazer Lapel Edges -->
  <path d="M 120 480 L 140 370 L 175 325" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M 280 480 L 260 370 L 225 325" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9"/>

  <!-- White Inner Shirt Collar -->
  <path d="M 158 318 L 195 365 L 200 348 L 176 312 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M 242 318 L 205 365 L 200 348 L 224 312 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Neck -->
  <path d="M 172 255 L 172 328 Q 200 342 228 328 L 228 255 Z" fill="#d4a883"/>
  <path d="M 175 310 Q 200 324 225 310" fill="#b9855e" opacity="0.4"/>

  <!-- Dark Navy Tie -->
  <path d="M 192 344 L 208 344 L 205 364 L 195 364 Z" fill="#152136"/>
  <path d="M 194 364 L 206 364 L 212 450 L 200 462 L 188 450 Z" fill="#1b2942" stroke="#0e1726" stroke-width="1.2"/>

  <!-- Yellow Competition / ID Ribbon Lanyard -->
  <path d="M 148 335 L 185 460 L 195 460 L 160 335 Z" fill="url(#ribbon-grad)"/>
  <path d="M 252 335 L 215 460 L 205 460 L 240 335 Z" fill="url(#ribbon-grad)"/>

  <!-- Round ID Badge Pin / Medal -->
  <circle cx="218" cy="400" r="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <circle cx="218" cy="400" r="15" fill="#f8fafc"/>
  <rect x="208" y="394" width="20" height="4" fill="#e11d48" rx="1"/>
  <rect x="210" y="401" width="16" height="3" fill="#64748b" rx="1"/>

  <!-- Apex International School Embroidered Crest on Chest -->
  <g transform="translate(248, 410) scale(0.65)">
    <path d="M 20 0 Q 40 -5 60 0 L 60 35 Q 40 55 20 40 Z" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="40" cy="18" r="12" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
    <path d="M 32 18 L 40 10 L 48 18 L 40 26 Z" fill="#38bdf8"/>
  </g>

  <!-- Head / Face -->
  <ellipse cx="200" cy="205" rx="74" ry="88" fill="url(#face-grad)"/>

  <!-- Soft Cheek Contour -->
  <path d="M 134 195 Q 140 265 170 286 Q 200 296 230 286 Q 260 265 266 195 Q 254 278 200 290 Q 146 278 134 195 Z" fill="#c39169" opacity="0.3"/>

  <!-- White Hairband / Headband on Forehead -->
  <path d="M 136 150 Q 200 100 264 150 Q 200 114 136 150 Z" fill="#ffffff" filter="url(#soft-shadow)"/>

  <!-- Bob Cut Front Bangs and Side Locks -->
  <path d="M 124 175 Q 118 120 155 80 Q 200 55 245 80 Q 282 120 276 175 Q 272 130 242 90 Q 200 68 158 90 Q 128 130 124 175 Z" fill="url(#hair-grad)"/>
  <path d="M 122 175 Q 115 235 140 285 Q 130 220 134 170 Z" fill="url(#hair-grad)"/>
  <path d="M 278 175 Q 285 235 260 285 Q 270 220 266 170 Z" fill="url(#hair-grad)"/>

  <!-- Eyebrows -->
  <path d="M 148 162 Q 170 152 188 160" stroke="#25160c" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <path d="M 252 162 Q 230 152 212 160" stroke="#25160c" stroke-width="4.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Warm, Big, Expressive) -->
  <ellipse cx="168" cy="180" rx="14" ry="9" fill="#ffffff"/>
  <ellipse cx="232" cy="180" rx="14" ry="9" fill="#ffffff"/>

  <ellipse cx="168" cy="180" rx="8" ry="8" fill="#2d170b"/>
  <ellipse cx="232" cy="180" rx="8" ry="8" fill="#2d170b"/>

  <circle cx="168" cy="180" r="4.2" fill="#080301"/>
  <circle cx="232" cy="180" r="4.2" fill="#080301"/>

  <!-- Eye Highlights -->
  <circle cx="166" cy="177" r="2.4" fill="#ffffff"/>
  <circle cx="230" cy="177" r="2.4" fill="#ffffff"/>
  <circle cx="170" cy="182" r="1.1" fill="#ffffff" opacity="0.8"/>
  <circle cx="234" cy="182" r="1.1" fill="#ffffff" opacity="0.8"/>

  <!-- Eyelashes -->
  <path d="M 153 178 Q 168 170 183 179" stroke="#1d0d05" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 217 178 Q 232 170 247 179" stroke="#1d0d05" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 198 178 Q 194 210 190 222 Q 200 228 210 222 Q 206 210 202 178" fill="#c7926b" opacity="0.32"/>
  <ellipse cx="200" cy="224" rx="8" ry="4.2" fill="#bf855b" opacity="0.45"/>
  <circle cx="193" cy="225" r="1.6" fill="#7a4421"/>
  <circle cx="207" cy="225" r="1.6" fill="#7a4421"/>

  <!-- Gentle Smile showing Teeth -->
  <path d="M 174 246 Q 200 270 226 246 Q 200 252 174 246 Z" fill="#a43e49"/>
  <!-- Teeth -->
  <path d="M 179 249 Q 200 255 221 249 Q 216 256 200 257 Q 184 256 179 249 Z" fill="#ffffff"/>
  <!-- Upper Lip -->
  <path d="M 174 246 Q 187 242 200 244 Q 213 242 226 246 Q 200 248 174 246 Z" fill="#b84e5a"/>
  <!-- Lower Lip -->
  <path d="M 178 259 Q 200 271 222 259 Q 200 274 178 259 Z" fill="#c7626e"/>

  <!-- Bottom Badge: Name & CanSat ID -->
  <rect x="30" y="420" width="340" height="46" rx="12" fill="#09122c" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="200" y="442" font-family="'Rajdhani', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
    SIDDHI SOMNATH MORE
  </text>
  <text x="200" y="457" font-family="'Rajdhani', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#38bdf8">
    CanSat-014 • Apex International School
  </text>
</svg>
